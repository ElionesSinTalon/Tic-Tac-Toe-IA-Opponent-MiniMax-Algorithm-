<!DOCTYPE html>
<html lang = "en">


<head>
    <title>Tic Tac Toe (MiniMax)</title>

    <link href = "https://fonts.googleapis.com/css?family=Roboto:400,700" rel = "stylesheet">

    <link rel = "stylesheet" href = "styles.css">

</head>

<body>
    <!-- Player Selection -->
    <div class = "selection">
        <h2>Tic Tac Toe</h2>
        <p>Select Your Player</p>
        <div class = "players">
            <button
                class = "player"
                onclick = "playerSelect('X')"
            >
                X
            </button>
            <button
                class = "player"
                onclick = "playerSelect('O')"
            >
                O
            </button>
        </div>
    </div>

    <script src = "game.js" type = "text/javascript"></script>
    <script src = "minimax.js" type = "text/javascript"></script>

</body>
